<!doctype html>
<!-- GitHub social preview, 1280 x 640. Render: see README.md in this folder. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="artwork.css" />
    <style>
      .canvas {
        width: 1280px;
        height: 640px;
      }
      .mark {
        position: absolute;
        left: 98px;
        top: 108px;
      }
      h1 {
        position: absolute;
        left: 92px;
        top: 206px;
        font-size: 168px;
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .name {
        position: absolute;
        left: 98px;
        top: 394px;
        font-family: var(--mono);
        font-size: 34px;
        font-weight: 500;
      }
      .line {
        position: absolute;
        left: 98px;
        top: 454px;
        width: 760px;
        font-family: var(--mono);
        font-size: 23px;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      .events {
        position: absolute;
        right: 96px;
        top: 178px;
        width: 330px;
        font-family: var(--mono);
        font-size: 19px;
        line-height: 1;
      }
      .events div {
        display: flex;
        justify-content: space-between;
        padding: 13px 18px;
        border: 1.5px solid var(--violet-dim);
        border-radius: 10px;
        margin-bottom: 12px;
        color: var(--ink-soft);
      }
      .events div b {
        font-weight: 400;
        color: var(--string);
      }
      .events div.done {
        border-color: var(--violet);
        background: rgba(124, 77, 255, 0.16);
        color: var(--ink);
      }
      .events div.stop {
        border-color: var(--ink-faint);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="hatch" style="right: -220px; top: -260px; width: 760px; height: 760px"></div>
      <div class="hatch flip" style="left: -300px; bottom: -420px; width: 820px; height: 820px"></div>

      <svg class="mark" viewBox="0 0 32 32" width="84" height="84" aria-hidden="true">
        <rect x="1" y="1" width="14" height="14" rx="3.5" fill="#7c4dff" />
        <rect x="17" y="1" width="14" height="14" rx="3.5" fill="#2a2a33" />
        <rect x="1" y="17" width="14" height="14" rx="3.5" fill="#2a2a33" />
        <rect x="17" y="17" width="14" height="14" rx="3.5" fill="#7c4dff" />
        <g fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="central">
          <text x="8" y="8">M</text>
          <text x="24" y="8">M</text>
          <text x="8" y="24">S</text>
          <text x="24" y="24">P</text>
        </g>
      </svg>
      <h1>MMSP</h1>
      <p class="name">Model Message Stream Protocol</p>
      <p class="line">One message format and one streaming grammar for every model provider.</p>

      <div class="events">
        <div><span>delta</span><b>text.delta</b></div>
        <div><span>delta</span><b>text.delta</b></div>
        <div><span>delta</span><b>text.delta</b></div>
        <div class="done"><span>delta</span><b>text.done</b></div>
        <div class="stop"><span>stop</span><span>usage</span></div>
      </div>
    </div>
  </body>
</html>
