<!doctype html>
<!-- README header, 1500 x 500 rendered at 2x. Render: see README.md in this folder. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="artwork.css" />
    <style>
      .canvas {
        width: 1500px;
        height: 500px;
        text-align: center;
      }
      .lockup {
        position: absolute;
        inset: 104px 0 auto 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
      }
      h1 {
        font-size: 150px;
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .name {
        position: absolute;
        inset: 306px 0 auto 0;
        font-family: var(--mono);
        font-size: 31px;
        font-weight: 500;
      }
      .line {
        position: absolute;
        inset: 368px 0 auto 0;
        font-family: var(--mono);
        font-size: 22px;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="hatch" style="right: -160px; top: -300px; width: 720px; height: 720px"></div>
      <div class="hatch flip" style="left: -120px; bottom: -420px; width: 700px; height: 700px"></div>

      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" width="116" height="116" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#2a2a33" />
        <path d="M0 16V7a7 7 0 0 1 7-7h9v16Z" fill="#7aa2f7" />
        <path d="M16 16h16v9a7 7 0 0 1-7 7h-9Z" fill="#7aa2f7" />
        <g fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">
          <text x="8.5" y="8.5" fill="#16161e">M</text>
          <text x="23.5" y="8.5">M</text>
          <text x="8.5" y="23.5">S</text>
          <text x="23.5" y="23.5" fill="#16161e">P</text>
        </g>
      </svg>
        <h1>MMSP</h1>
      </div>
      <p class="name">Model Message Stream Protocol</p>
      <p class="line">One message format and one streaming grammar for every model provider.</p>
    </div>
  </body>
</html>
