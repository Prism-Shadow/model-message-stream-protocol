name: TypeScript Tests

on:
  workflow_call:
    inputs:
      clients:
        description: JSON array of client types; ["*"] runs all configured model cases.
        type: string
        default: '["*"]'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version:
          - "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./src_ts/package-lock.json"

      - name: Install dependencies
        working-directory: ./src_ts
        run: |
          npm ci

      - name: Run linter
        working-directory: ./src_ts
        run: |
          npm run lint

      - name: Run build
        working-directory: ./src_ts
        run: |
          npm run build

      - name: Run tests
        working-directory: ./src_ts
        run: |
          npm test
        env:
          MMSP_TEST_CLIENTS: ${{ inputs.clients }}
          MMSP_REQUIRE_KEYS: "1"
          RUN_SLOW_TEST: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODELVERSE_API_KEY: ${{ secrets.MODELVERSE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
