name: Python Tests

on:
  workflow_call:
    inputs:
      clients:
        description: JSON array of client types; ["*"] runs all configured model cases.
        type: string
        default: '["*"]'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          github-token: ${{ github.token }}

      - name: Install dependencies
        working-directory: ./src_py
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run linter
        working-directory: ./src_py
        run: |
          make lint
          uv run ruff check --config pyproject.toml ../.github/ci ../.github/status
          uv run ruff format --check --config pyproject.toml ../.github/ci ../.github/status

      - name: Run tests
        working-directory: ./src_py
        run: |
          uv run pytest -vvv -n 16 --dist loadgroup \
            --reruns 5 --reruns-delay 30 --only-rerun RateLimitError --only-rerun 429 \
            tests
        env:
          MMSP_TEST_CLIENTS: ${{ inputs.clients }}
          MMSP_REQUIRE_KEYS: "1"
          RUN_SLOW_TEST: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODELVERSE_API_KEY: ${{ secrets.MODELVERSE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
