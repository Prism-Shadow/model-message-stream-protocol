name: Python Tests on Older SDK Lines

# The offline tests again on the older anthropic and google-genai lines pyproject.toml accepts. They call
# no model, so CI runs them beside the live tests rather than in the queue that keeps the API calls apart.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.requirement }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: anthropic
            requirement: "anthropic[bedrock]<2"
          - package: anthropic
            requirement: "anthropic[bedrock]==0.87.0"
          - package: google-genai
            requirement: "google-genai<3"
          - package: google-genai
            requirement: "google-genai==2.23.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          github-token: ${{ github.token }}

      - name: Install dependencies
        working-directory: ./src_py
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run the offline tests
        working-directory: ./src_py
        run: |
          uv run --with "$REQUIREMENT" python -c \
            'import importlib.metadata, sys; print(sys.argv[1], importlib.metadata.version(sys.argv[1]))' "$PACKAGE"
          uv run --with "$REQUIREMENT" pytest -n 16 --dist loadgroup tests
        env:
          PACKAGE: ${{ matrix.package }}
          REQUIREMENT: ${{ matrix.requirement }}
          MMSP_TEST_CLIENTS: "[]"
