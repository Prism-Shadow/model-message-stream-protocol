name: Site

on:
  push:
    branches:
      - "main"
    paths:
      - "site/**"
      - ".github/images/social-preview.png"
      - "CHANGELOG.md"
      - "CHANGELOG.zh.md"
      - "design/**"
      # the model catalog is built from the SDK's registry and its family table
      - "src_ts/src/registry.ts"
      - "src_ts/src/credentials.ts"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - "main"
      - "dev"
    paths:
      - "site/**"
      - ".github/images/social-preview.png"
      - "CHANGELOG.md"
      - "CHANGELOG.zh.md"
      - "design/**"
      # the model catalog is built from the SDK's registry and its family table
      - "src_ts/src/registry.ts"
      - "src_ts/src/credentials.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the status page and the catalog are built with the status probe's files
      - name: Check out the status data
        run: |
          if git ls-remote --exit-code --heads origin status-data; then
            git fetch --depth=1 origin status-data
            git worktree add --detach status-data FETCH_HEAD
            echo "MMSP_STATUS_DIR=$GITHUB_WORKSPACE/status-data" >> "$GITHUB_ENV"
          else
            # exit code 2 means the branch does not exist; anything else is a failure to look
            test "$?" -eq 2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Build
        working-directory: ./site
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # a pull request only builds; the site is published from main
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
